[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkstatute-skill-materializer"
version = "1.0.0"
description = "Skill corpus materializer — produces per-backend skill layouts (Hermes profile / ACP agent skills) from skill-index.json, with host assumption rewriting and three-separation routing manifests."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.inkstatute]
subsystem = "skill-materializer"
default_off_flag = "skill_materializer_enabled"
