[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inkstatute-acp-client"
version = "0.1.0"
description = "InkStatute ACP Backend Client — drives any ACP v1 agent as a backend over stdio."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "InkStatute" }
]
dependencies = [
  "agent-client-protocol>=0.12,<0.13",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
