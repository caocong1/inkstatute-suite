[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inkstatute-channel-core"
version = "0.1.0"
description = "Channel-generic logic (idempotency, delivery guard, active task router, output policy) shared across InkStatute channel adapters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "InkStatute" }
]
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
