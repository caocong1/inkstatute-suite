[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inkstatute-model-gateway"
version = "0.1.0"
description = "Composite Model Provider Gateway BackendAdapter wrapping multiple provider_model sub-adapters."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "InkStatute" }
]
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
