[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inkstatute-acp-event-bridge"
version = "0.1.0"
description = "InkStatute ACP Event Bridge — bidirectional event mapping and output boundary enforcement between ACP backends and the platform."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "InkStatute" }
]
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
