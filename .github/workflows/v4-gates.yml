name: V4 Gates

on:
  pull_request:
  push:
    paths:
      - "apps/flutter_app/**"
      - "engines/**"
      - "scripts/run_v4_gates.py"
      - "scripts/test_run_v4_gates.py"
      - "scripts/build_dsh_release.sh"
      - "scripts/test_build_dsh_release.sh"
      - "presets/**"
      - ".github/workflows/v4-gates.yml"

jobs:
  v4-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install Flutter app dependencies
        working-directory: apps/flutter_app
        run: flutter pub get

      - name: Run V4 gates
        run: python3 scripts/run_v4_gates.py
