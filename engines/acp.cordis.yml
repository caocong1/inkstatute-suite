# V5：三面接入 —— 本文件是控制面(ACP stdio)与观测面(明文 session.jsonl)的共同配置源。
# InkStatute V4 engine ACP composition.
# Approval stack: terminal/execute_code default deny → escalate to user card (DP-3).
# Approval: ASK → terminal/execute_code requests escalate to session/request_permission
# → app renders user card with allow-once/reject-once (no batch approval path).
# The API key is runtime-injected via environment, NOT baked into this config.

# 多供应商适配器。apiKeyEnv 是凭据"引用"而非凭据本身 —— 密钥不进本文件，
# 由 app 在 spawn 时按当前供应商注入对应环境变量。
- id: llm
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      deepseek:
        apiKeyEnv: DEEPSEEK_API_KEY
        reasoning: high
      openai:
        apiKeyEnv: OPENAI_API_KEY
      anthropic:
        apiKeyEnv: ANTHROPIC_API_KEY
      google:
        apiKeyEnv: GOOGLE_API_KEY
      groq:
        apiKeyEnv: GROQ_API_KEY
      xai:
        apiKeyEnv: XAI_API_KEY
      # 智谱：pi-ai 未预装，按 OpenAI-compatible 网关显式声明。
      zhipu:
        displayName: 智谱
        apiKeyEnv: ZHIPU_API_KEY
        api: openai-completions
        baseURL: https://open.bigmodel.cn/api/paas/v4/
        models:
          - id: glm-4-plus
            name: GLM-4 Plus
            contextWindow: 128000
            maxTokens: 4096
          - id: glm-4-flash
            name: GLM-4 Flash
            contextWindow: 128000
            maxTokens: 4096
      qwen-token-plan-cn:
        apiKeyEnv: QWEN_API_KEY

# DeepSeek 官方路由保留 —— acp-agent 的 provider: deepseek-official 走它。
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro

# Sandbox: workspace-write confines bash and filesystem tools to the session cwd.
# Terminal/execute_code requests that exceed sandbox permissions are escalated
# via the approval seam → session/request_permission → app user card.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()

# Managed child-process groups for the bash executor.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  config:
    timeoutMs: 60000

# Approval: ASK → terminal/execute_code requests escalate to session/request_permission.
# The ACP bridge sends allow-once/reject-once options; no batch approval path exists.
# App policy: unknown kind → auto-reject; terminal/execute_code → render user card.
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

# The ACP automation app: agent spine + JSONL persistence + protocol bridge.
# Persistence root: DSH_HOME/sessions (platform-resolved at runtime).
- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro
    # DSH_HOME 变量不被 Cordis 展开 —— 写成 '.../sessions' 会在引擎目录下建出名为该变量的
    # 字面量目录，导致会话历史随引擎更新被抹掉。必须用 !!js 标签取环境变量。
    persistenceRoot: !!js process.env.DSH_HOME + '/sessions'
    # 观测面依赖明文 NDJSON：packChunks:false 让每个事件独占一行，
    # compression:none 关闭 zstd 分帧。二者缺一则 Rust 侧无法尾随。
    persistenceCompression: none
    packChunks: false
    workspaceContext:
      maxBytes: 65536
    # Persona: legal assistant identity and behavior. Tool plugins own tool guidance.
    # The loop resolves {{model}} and each ACP session's client-supplied {{cwd}}.
    # Legal guardrails persona segments are added in Phase 113 (domain presets).
    persona: |
      You are a legal assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by checking references and citations. Keep answers brief and factual.
    # Skill filesystem: customSkillDirs placeholder — Phase 113 configures domain preset directories.
    # Rank 300 entries are scanned after project roots and before user roots.
    skills:
      filesystem:
        customSkillDirs: []

# Replay-aware request pressure; the routed adapter supplies model capacity.
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

# Summarize an older range after measured pressure or a canonical provider overflow.
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1

# Projection registry: subagent catalog identity.
- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

# The filesystem stack rides the SAME sandbox policy as bash: dsh-fs-sandbox
# fences write/edit by the effective mode (workspace-write contains to workspace + temp roots).
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# Todo tool for task tracking.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Identical repeat calls trigger advisory context, never a block.
- id: repeat-tool-reminder
  name: '@deepseek-ai/dsh-repeat-tool-reminder'
