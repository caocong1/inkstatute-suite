[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkstatute-lawyer-web-chat"
version = "0.1.0"
description = "Server-side rendered Lawyer Web Chat with SSE streaming for InkStatute V2."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
