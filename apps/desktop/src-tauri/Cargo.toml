[package]
name = "inkstatute-desktop"
version = "0.1.0"
description = "墨律 InkStatute — Desktop client (Tauri 2 shell)"
authors = ["InkStatute"]
edition = "2021"
default-run = "inkstatute-desktop"

[lib]
name = "inkstatute_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "store-key"
path = "src/bin/store_key.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
log = "0.4"
walkdir = "2"
encoding_rs = "0.8"
sha2 = "0.10"
regex = "1"
hex = "0.4"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures = "0.3"
flate2 = "1"
tar = "0.4"
base64 = "0.22"
thiserror = "2"
rpassword = "7"
tokio-util = { version = "0.7", features = ["codec"] }
serde_yaml = "0.9"
libc = "0.2"

# keyring 3.x 不提供默认后端：不显式启用 feature 就编译成内存 mock，
# store 看似成功、进程退出即丢，OS 凭据库根本没被写入。
# 必须按平台显式指定后端。
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
